<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>NNAnything configured weight consumer</title>
<style>
  body { margin: 32px; font: 16px system-ui; min-height: 500px; }
  main { max-width: 480px; padding: 20px; }
  svg { width: 32px; height: 32px; }
  button, input { margin: 12px; padding: 10px; }
</style>
<main>
  <h1>Configured weight consumer</h1>
  <p id="reading-target">可读正文 <em>保留文字</em></p>
  <svg id="outer-icon" viewBox="0 0 24 24" aria-label="图形">
    <path id="drawing-part" d="M3 3h18v18H3z" fill="green"></path>
  </svg>
  <button id="action-target" type="button">可用按钮</button>
  <input id="input-target" aria-label="测试输入" placeholder="可输入">
</main>
<div id="bounded-parent" style="display:flex; gap:12px; margin:12px; width:680px">
  <div id="bounded-text"><span>外层结构完整</span></div>
  <div id="bounded-frame"><span>保留内嵌外框</span><iframe title="未读取的内嵌区域" src="about:blank" style="width:120px;height:50px"></iframe></div>
</div>
<div id="coincident-input-group" style="position:relative; margin:12px; width:220px; height:45px">
  <textarea aria-label="重合输入前层" style="position:absolute;left:0;top:0;width:220px;height:40px;box-sizing:border-box"></textarea>
  <textarea aria-label="重合输入后层" style="position:absolute;left:0;top:0;width:220px;height:40px;box-sizing:border-box"></textarea>
</div>
<script src="../../artifacts/chrome-extension/content.js"></script>
</html>
